name: Experimental agent-action replay

on:
  push:
    branches: [research/agent-action-browser-verify-v0]
  pull_request:
    paths:
      - research/agent-action-browser-verify-v0/**
      - .github/workflows/agent-action-research.yml

permissions:
  contents: read

concurrency:
  group: agent-action-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Experimental replay (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out the exact event head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select external replay paths
        shell: bash
        run: |
          printf '%s\n' \
            "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/research-playwright-browsers" \
            "PLAYWRIGHT_MODULE=$RUNNER_TEMP/research-playwright/node_modules/playwright/index.mjs" \
            "AGENT_ACTION_SUPPORT=$RUNNER_TEMP/research-agent-action-support" \
            >> "$GITHUB_ENV"
      - name: Select Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked host dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install an external browser-test runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/research-playwright" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/research-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Replay without a global python alias
        run: python research/agent-action-browser-verify-v0/tools/ci-replay.py
      - name: Upload generated reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-action-research-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/research-ci-upload/
          if-no-files-found: warn
          retention-days: 14
