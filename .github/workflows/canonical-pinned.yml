name: Canonical pinned public candidate

on:
  push:
    branches: [codex/ci-v0.1.0]

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout CI controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: controller
          persist-credentials: false
      - name: Checkout immutable public candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 62cd3e59c8f568496ed087d55f0aec3d63363b0a
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Reproduce exact candidate and assert nonempty semantic gates
        run: python controller/tools/public_release_gate.py --repo candidate --out "${{ runner.temp }}/release-evidence"
      - name: Save command receipts and actual counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-62cd3e5-ubuntu
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 90
